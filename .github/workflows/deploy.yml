name: Godot Web Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: godot-web-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GODOT: /usr/local/bin/godot
  WORKSPACE: /var/lib/godot/workspace-${{ github.ref_name }}
  RELEASES: /var/www/godot/releases
  PRODUCTION: /var/www/godot/production
  STAGING: /var/www/godot/staging

jobs:
  build:
    runs-on: [self-hosted, godot, proxmox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load config
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; cfg=json.load(open('.github/config.json')); print('DOMAIN=' + cfg['domain']); print('THEME_COLOR=' + cfg['theme_color'])" >> "$GITHUB_ENV"
          echo "GAME_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Set deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DEPLOY_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "IS_STAGING=0" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_URL=https://$DOMAIN/staging" >> "$GITHUB_ENV"
            echo "IS_STAGING=1" >> "$GITHUB_ENV"
          fi
          
      - name: Set build id
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_ID=$(date +%s)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".godot" \
            --exclude ".import" \
            --exclude "addons/godot-git-plugin" \
            ./ "$WORKSPACE/"
            
      - name: Write version
        shell: bash
        run: |
          set -euo pipefail
      
          CHANNEL="staging"
          [[ "$GITHUB_REF_NAME" == "main" ]] && CHANNEL="release"
      
          MAJOR=0
          MINOR=1
          PATCH=0
      
          mkdir -p "$WORKSPACE/resources"
          cat > "$WORKSPACE/resources/version.cfg" <<EOF
          [version]
          major=$MAJOR
          minor=$MINOR
          patch=$PATCH
          
          [channel]
          name="$CHANNEL"
          
          [build]
          commit="${GITHUB_SHA::7}"
          id="$BUILD_ID"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF
          
      - name: Clear Godot import cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORKSPACE/.godot"
            
      - name: Import project
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --import --quit

      - name: Export web build
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          BUILD_ID="$(date +%s)-${GITHUB_SHA::7}"
          BUILD_DIR="$RELEASES/$BUILD_ID"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          mkdir -p "$RELEASES"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --export-release Web \
            "$BUILD_DIR/index.html"
          sync

      - name: Copy PWA assets
        shell: bash
        run: |
          set -euo pipefail
          cp "$WORKSPACE/.github/PWA/"*.png "$BUILD_DIR/" || true
          mkdir -p "$BUILD_DIR/screenshots"
          cp "$WORKSPACE/.github/PWA/desktop.png" "$BUILD_DIR/screenshots/"
          cp "$WORKSPACE/.github/PWA/mobile.png" "$BUILD_DIR/screenshots/"

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail
      
          printf '%s\n' \
            '{' \
            "  \"name\": \"$GAME_NAME\"," \
            "  \"short_name\": \"$GAME_NAME\"," \
            '  "start_url": "/index.html",' \
            '  "scope": "/",' \
            '  "display": "standalone",' \
            "  \"theme_color\": \"$THEME_COLOR\"," \
            "  \"background_color\": \"$THEME_COLOR\"" \
            '}' \
            > "$BUILD_DIR/manifest.webmanifest"

      - name: Deploy (atomic swap)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGET="$PRODUCTION"
          else
            TARGET="$STAGING"
          fi
          sync
          ln -sfn "$BUILD_DIR" "$TARGET.tmp"
          mv -Tf "$TARGET.tmp" "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Validate deployed build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(readlink -f "$TARGET")" == "$BUILD_DIR" ]]

      - name: Cleanup releases
        shell: bash
        run: |
          set -euo pipefail
          KEEP=10
          PROD="$(readlink -f "$PRODUCTION" 2>/dev/null || true)"
          STAGE="$(readlink -f "$STAGING" 2>/dev/null || true)"
          mapfile -t releases < <(
            find "$RELEASES" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
          )
          count=0
          for r in "${releases[@]}"; do
            [[ -z "$r" ]] && continue
            [[ "$r" == "$PROD" || "$r" == "$STAGE" ]] && continue
            ((++count))
            if (( count > KEEP )); then
              rm -rf -- "$r"
            fi
          done
