name: Godot Web Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: godot-web-deploy
  cancel-in-progress: true

env:
  GODOT: /usr/local/bin/godot
  WORKSPACE: /var/lib/godot/workspace
  RELEASES: /var/www/godot/releases
  PRODUCTION: /var/www/godot/production
  STAGING: /var/www/godot/staging

jobs:
  build:
    runs-on: [self-hosted, godot, proxmox]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load config
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_ENV"
import json

cfg = json.load(open(".github/config.json"))
print(f"DOMAIN={cfg['domain']}")
print(f"THEME_COLOR={cfg['theme_color']}")
PY

          echo "GAME_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Set deployment metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DEPLOY_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "IS_STAGING=0" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_URL=https://$DOMAIN/staging" >> "$GITHUB_ENV"
            echo "IS_STAGING=1" >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".godot" \
            --exclude ".import" \
            ./ "$WORKSPACE/"

      - name: Import project
        shell: bash
        env:
          HOME: /home/godot
        run: |
          set -euo pipefail

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --import --quit

      - name: Export web build
        shell: bash
        env:
          HOME: /home/godot
        run: |
          set -euo pipefail

          BUILD_ID="$(date +%s)-${GITHUB_SHA::7}"
          BUILD_DIR="$RELEASES/$BUILD_ID"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --export-release Web \
            "$BUILD_DIR/index.html"

          sync

      # ─────────────────────────────────────────────
      # SAFE VERSION GENERATION (no sed, no YAML risk)
      - name: Write version (authoritative)
        shell: bash
        run: |
          set -euo pipefail

          SRC="$WORKSPACE/version.cfg"
          DST="$BUILD_DIR/version.cfg"

          MAJOR=$(awk -F= '/^major=/{print $2}' "$SRC" 2>/dev/null || echo 0)
          MINOR=$(awk -F= '/^minor=/{print $2}' "$SRC" 2>/dev/null || echo 0)
          PATCH=$(awk -F= '/^patch=/{print $2}' "$SRC" 2>/dev/null || echo 0)

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            CHANNEL="release"
          else
            CHANNEL="staging"
          fi

          cat > "$DST" <<EOF
[version]
major=$MAJOR
minor=$MINOR
patch=$PATCH

[channel]
name=$CHANNEL

[build]
commit=${GITHUB_SHA::7}
id=$BUILD_ID
date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
EOF

      - name: Copy PWA assets
        shell: bash
        run: |
          set -euo pipefail

          cp "$WORKSPACE/.github/PWA/"*.png "$BUILD_DIR/"
          mkdir -p "$BUILD_DIR/screenshots"
          cp "$WORKSPACE/.github/PWA/desktop.png" "$BUILD_DIR/screenshots/"
          cp "$WORKSPACE/.github/PWA/mobile.png" "$BUILD_DIR/screenshots/"

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BUILD_DIR/manifest.webmanifest" <<EOF
{
  "name": "$GAME_NAME",
  "short_name": "$GAME_NAME",
  "start_url": "/index.html",
  "scope": "/",
  "display": "standalone",
  "theme_color": "$THEME_COLOR",
  "background_color": "$THEME_COLOR"
}
EOF

      - name: Generate robots.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_STAGING" == "1" ]]; then
            echo -e "User-agent: *\nDisallow: /" > "$BUILD_DIR/robots.txt"
          else
            echo -e "User-agent: *\nAllow: /\nSitemap: $DEPLOY_URL/sitemap.xml" > "$BUILD_DIR/robots.txt"
          fi

      - name: Patch index.html
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_DIR/index.html" <<'PY'
from pathlib import Path
import sys

p = Path(sys.argv[1])
html = p.read_text()

html = html.replace(
    "overflow: hidden;",
    "overflow: hidden; width: 100vw; height: 100vh;"
)

p.write_text(html)
PY

      - name: Validate build (strict)
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=(
            index.html index.js index.wasm index.pck
            manifest.webmanifest version.cfg
          )

          for f in "${REQUIRED[@]}"; do
            [[ -s "$BUILD_DIR/$f" ]] || {
              echo "Missing: $f"
              exit 1
            }
          done

      - name: Deploy (atomic swap)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGET="$PRODUCTION"
          else
            TARGET="$STAGING"
          fi

          sync
          ln -sfn "$BUILD_DIR" "$TARGET.tmp"
          mv -Tf "$TARGET.tmp" "$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Validate deployed build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(readlink -f "$TARGET")" == "$BUILD_DIR" ]]

      - name: Cleanup releases
        shell: bash
        run: |
          set -euo pipefail

          KEEP=10

          PROD="$(readlink -f "$PRODUCTION" 2>/dev/null || true)"
          STAGE="$(readlink -f "$STAGING" 2>/dev/null || true)"

          mapfile -t releases < <(
            find "$RELEASES" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
          )

          count=0

          for r in "${releases[@]}"; do
            [[ -z "$r" ]] && continue

            if [[ "$r" == "$PROD" || "$r" == "$STAGE" ]]; then
              continue
            fi

            ((count++))

            if (( count > KEEP )); then
              rm -rf -- "$r"
            fi
          done
