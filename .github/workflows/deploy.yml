name: Deploy Godot Web

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: godot-web-deploy
  cancel-in-progress: true

env:
  GODOT:      /usr/local/bin/godot
  WORKSPACE:  /var/lib/godot/workspace
  RELEASES:   /var/www/godot/releases
  PRODUCTION: /var/www/godot/production
  STAGING:    /var/www/godot/staging

jobs:
  build:
    runs-on: [self-hosted, godot, proxmox]

    steps:

      # ──────────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────────
      # Read domain and theme color from .github/config.json.
      # GAME_NAME is always the repository name — rename the repo to update it everywhere.
      - name: Load config
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json

          cfg = json.load(open(".github/config.json"))

          print(f"DOMAIN={cfg['domain']}")
          print(f"THEME_COLOR={cfg['theme_color']}")
          PY

          echo "GAME_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────────────────────────────────
      # Set branch-specific values used by later steps.
      - name: Set deployment metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DEPLOY_URL=https://$DOMAIN"    >> "$GITHUB_ENV"
            echo "IS_STAGING=0"                  >> "$GITHUB_ENV"
          else
            echo "DEPLOY_URL=https://$DOMAIN/staging" >> "$GITHUB_ENV"
            echo "IS_STAGING=1"                        >> "$GITHUB_ENV"
          fi

      - name: Set build id
        run: |
            echo "BUILD_ID=$(date +%s)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────────────────────────────────
      # Sync the project to a fixed workspace path.
      # .godot/ is excluded and regenerated by the import step below.
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          rsync -a \
            --delete \
            --exclude ".bak" \
            --exclude ".git" \
            --exclude ".godot" \
            --exclude ".import" \
            --exclude "addons/godot-git-plugin" \
            --exclude "exports" \
            ./ "$WORKSPACE/"

      # ──────────────────────────────────────────────────────────────────────────
      # Populate .godot/ (shader cache, resource UID index).
      # This step is mandatory — exporting without it produces an incomplete build.
      - name: Import project
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --import --quit

      # ──────────────────────────────────────────────────────────────────────────
      # Generate the version label information for the game
      - name: Write version info
      shell: bash
      run: |
        set -euo pipefail

        VERSION_FILE="$WORKSPACE/version.cfg"

        MAJOR=$(awk -F= '/^major=/{print $2}' "$VERSION_FILE" || echo 0)
        MINOR=$(awk -F= '/^minor=/{print $2}' "$VERSION_FILE" || echo 0)
        PATCH=$(awk -F= '/^patch=/{print $2}' "$VERSION_FILE" || echo 0)

        if [[ "$GITHUB_REF_NAME" == "main" ]]; then
        CHANNEL="release"
        elif [[ "$GITHUB_REF_NAME" == "staging" ]]; then
        CHANNEL="staging"
        else
        CHANNEL="dev"
        fi

        cat > "$VERSION_FILE" <<EOF
            [version]
            major=$MAJOR
            minor=$MINOR
            patch=$PATCH

            [channel]
            name=$CHANNEL

            [build]
            commit=${GITHUB_SHA::7}
            id=$BUILD_ID
            date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            EOF

      # ──────────────────────────────────────────────────────────────────────────
      # Export using the "Web" preset from export_presets.cfg.
      # Build ID: {unix-timestamp}-{git-sha-7} — sortable and traceable.
      - name: Export web build
      shell: bash
      run: |
        set -euo pipefail

        BUILD_ID="$(date +%s)-${GITHUB_SHA::7}"

        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR"

        echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
        echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

        "$GODOT" --headless \
        --path "$WORKSPACE" \
        --export-release Web \
        "$BUILD_DIR/index.html"


      # ──────────────────────────────────────────────────────────────────────────
      # Godot generates index.manifest.json as part of its PWA export.
      # Remove it — CI generates a proper manifest.webmanifest instead.
      - name: Remove Godot-generated manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$BUILD_DIR/index.manifest.json"

      # ──────────────────────────────────────────────────────────────────────────
      # Copy version-controlled PWA assets into the build directory.
      # These are not generated by Godot and survive re-exports.
      - name: Copy PWA assets
        shell: bash
        run: |
          set -euo pipefail

          cp "$WORKSPACE/.github/PWA/icon_144x144.png" "$BUILD_DIR/icon_144x144.png"
          cp "$WORKSPACE/.github/PWA/icon_180x180.png" "$BUILD_DIR/icon_180x180.png"
          cp "$WORKSPACE/.github/PWA/icon_512x512.png" "$BUILD_DIR/icon_512x512.png"

          mkdir -p "$BUILD_DIR/screenshots"
          cp "$WORKSPACE/.github/PWA/desktop.png" "$BUILD_DIR/screenshots/desktop.png"
          cp "$WORKSPACE/.github/PWA/mobile.png"  "$BUILD_DIR/screenshots/mobile.png"

      # ──────────────────────────────────────────────────────────────────────────
      # Generate the web app manifest from config values.
      # The 512×512 icon is marked maskable for adaptive icon support.
      - name: Generate web manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BUILD_DIR/manifest.webmanifest" <<EOF
          {
            "id": "/index.html",
            "name": "$GAME_NAME",
            "short_name": "$GAME_NAME",
            "description": "$GAME_NAME is a browser-based game built with Godot.",
            "start_url": "/index.html",
            "scope": "/",
            "display": "standalone",
            "display_override": [
              "window-controls-overlay",
              "standalone"
            ],
            "orientation": "any",
            "background_color": "$THEME_COLOR",
            "theme_color": "$THEME_COLOR",
            "icons": [
              {
                "src": "/icon_144x144.png",
                "sizes": "144x144",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "/icon_180x180.png",
                "sizes": "180x180",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "/icon_512x512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable any"
              }
            ],
            "screenshots": [
              {
                "src": "/screenshots/desktop.png",
                "sizes": "1280x720",
                "type": "image/png",
                "form_factor": "wide"
              },
              {
                "src": "/screenshots/mobile.png",
                "sizes": "1080x1920",
                "type": "image/png"
              }
            ]
          }
          EOF

      # ──────────────────────────────────────────────────────────────────────────
      # Staging builds are blocked from crawling at the robots level and via
      # Caddy's X-Robots-Tag header. Production builds include a sitemap reference.
      - name: Generate robots.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_STAGING" == "1" ]]; then
            cat > "$BUILD_DIR/robots.txt" <<EOF
          User-agent: *
          Disallow: /
          EOF
          else
            cat > "$BUILD_DIR/robots.txt" <<EOF
          User-agent: *
          Allow: /

          Sitemap: $DEPLOY_URL/sitemap.xml
          EOF
          fi

      # ──────────────────────────────────────────────────────────────────────────
      # Patch Godot's index.html:
      #   - Remove user-scalable=no (accessibility)
      #   - Replace Godot's manifest link with the CI-generated one
      #   - Inject canonical URL, theme-color, SEO meta tags (OG + Twitter Card)
      #   - Set canvas to full viewport size
      #   - Inject AudioContext unlock snippet (browsers suspend audio until interaction)
      #   - Disable Godot's built-in COOP/COEP injection (nginx handles these headers)
      - name: Patch index.html
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_DIR/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys
          import os

          DEPLOY_URL  = os.environ["DEPLOY_URL"]
          GAME_NAME   = os.environ["GAME_NAME"]
          THEME_COLOR = os.environ["THEME_COLOR"]

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")

          # Allow pinch-to-zoom on mobile.
          html = html.replace(
              '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          )

          # Remove Godot's manifest link; CI generates manifest.webmanifest instead.
          html = re.sub(
              r'<link rel="manifest" href="index\.manifest\.json">\s*',
              '',
              html
          )

          # Inject head tags: manifest, canonical, SEO meta, OG, Twitter Card.
          inject_head = f'''
          <link rel="manifest" href="/manifest.webmanifest">

          <link rel="canonical"
                href="{DEPLOY_URL}/">

          <meta name="theme-color"
                content="{THEME_COLOR}">

          <meta name="description"
                content="Play {GAME_NAME} directly in your browser. A game built with Godot.">

          <meta property="og:type"        content="website">
          <meta property="og:title"       content="{GAME_NAME}">
          <meta property="og:description" content="Play {GAME_NAME} directly in your browser.">
          <meta property="og:url"         content="{DEPLOY_URL}/">
          <meta property="og:image"       content="{DEPLOY_URL}/icon_512x512.png">

          <meta name="twitter:card"        content="summary_large_image">
          <meta name="twitter:title"       content="{GAME_NAME}">
          <meta name="twitter:description" content="Play {GAME_NAME} directly in your browser.">
          <meta name="twitter:image"       content="{DEPLOY_URL}/icon_512x512.png">
          '''

          html = html.replace("</head>", inject_head + "\n</head>")

          # Stretch the canvas to the full viewport.
          html = re.sub(
              r'overflow:\s*hidden;',
              'overflow: hidden; width: 100vw; height: 100vh;',
              html
          )

          html = re.sub(
              r'#canvas\s*\{\s*display:\s*block;\s*\}',
              '#canvas { display: block; width: 100vw; height: 100vh; }',
              html
          )

          # Browsers suspend AudioContext until user interaction.
          # Resume on the first click, touch, or keydown.
          audio_unlock = r'''
          <script>
          (function () {
            var AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;

        var ctx;

        (function () {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        var ctx;

        function resume() {
            if (!ctx) ctx = new AudioContext();
            if (ctx.state === "suspended") ctx.resume();

            document.removeEventListener("click", resume);
            document.removeEventListener("touchstart", resume);
            document.removeEventListener("keydown", resume);
        }

        document.addEventListener("click", resume, { passive: true });
        document.addEventListener("touchstart", resume, { passive: true });
        document.addEventListener("keydown", resume, { passive: true });
        }());

          html = html.replace("<noscript>", audio_unlock + "\n<noscript>")

          # nginx handles COOP/COEP — disable Godot's built-in header injection
          # to prevent duplicate headers that break Cross-Origin Isolation.
          html = html.replace(
              '"ensureCrossOriginIsolationHeaders":true',
              '"ensureCrossOriginIsolationHeaders":false'
          )

          path.write_text(html, encoding="utf-8")
          PY

      # ──────────────────────────────────────────────────────────────────────────
      # Confirm all expected output files are present before deploying.
        - name: Validate output
        shell: bash
        run: |
            set -euo pipefail

            REQUIRED_FILES=(
            index.html
            index.js
            index.wasm
            index.pck
            manifest.webmanifest
            icon_144x144.png
            icon_180x180.png
            icon_512x512.png
            screenshots/desktop.png
            screenshots/mobile.png
            )

            missing=0

            for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$BUILD_DIR/$file" ]]; then
                echo "Missing required file: $file"
                missing=1
            fi
            done

            # extra safety checks
            [[ -s "$BUILD_DIR/index.wasm" ]] || { echo "index.wasm empty"; exit 1; }
            [[ -s "$BUILD_DIR/index.pck" ]]  || { echo "index.pck empty"; exit 1; }

            [[ "$missing" -eq 0 ]] || { echo "Validation failed — aborting deploy"; exit 1; }

            echo "All required files present"

      # ──────────────────────────────────────────────────────────────────────────
      # Atomic symlink swap: the old build stays live until the new one is fully
      # in place. No request is ever served from a partial or mixed-version build.
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            main)    TARGET="$PRODUCTION" ;;
            staging) TARGET="$STAGING"    ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          TMP_LINK="${TARGET}.tmp"

          ln -sfn "$BUILD_DIR" "$TMP_LINK"
          mv -Tf "$TMP_LINK" "$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Deployed to: $TARGET → $(readlink -f "$TARGET")"

      # ──────────────────────────────────────────────────────────────────────────
      - name: Validate deployed symlink
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REAL="$(readlink -f "$TARGET")"

          if [[ "$TARGET_REAL" != "$BUILD_DIR" ]]; then
            echo "Deploy symlink validation failed"
            echo "  expected: $BUILD_DIR"
            echo "  actual:   $TARGET_REAL"
            exit 1
          fi

          echo "Deploy validation OK"

      # ──────────────────────────────────────────────────────────────────────────
      # Retain the KEEP most recent builds that are not currently live.
      # The production and staging symlink targets are always preserved.
      - name: Cleanup old releases
        shell: bash
        run: |
          set -euo pipefail

          KEEP=10

          PROD_TARGET="$(readlink -f "$PRODUCTION" || true)"
          STAGE_TARGET="$(readlink -f "$STAGING"   || true)"

          mapfile -t releases < <(
            find "$RELEASES" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' \
              | sort -nr \
              | cut -d' ' -f2-
          )

          count=0
          for release in "${releases[@]}"; do
            if [[ "$release" == "$PROD_TARGET" || "$release" == "$STAGE_TARGET" ]]; then
              continue
            fi

            count=$((count + 1))
            if [[ "$count" -gt "$KEEP" ]]; then
              echo "Removing old release: $release"
              rm -rf "$release"
            fi
          done
