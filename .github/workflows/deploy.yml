name: Deploy Godot Web

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: godot-web-deploy
  cancel-in-progress: true

env:
  GODOT: /usr/local/bin/godot
  WORKSPACE: /var/lib/godot/workspace
  RELEASES: /var/www/godot/releases
  PRODUCTION: /var/www/godot/production
  STAGING: /var/www/godot/staging

jobs:
  build:
    runs-on: [self-hosted, godot, proxmox]

    steps:

      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      - name: Load config
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json

          cfg = json.load(open(".github/config.json"))

          print(f"DOMAIN={cfg['domain']}")
          print(f"THEME_COLOR={cfg['theme_color']}")
          PY

          echo "GAME_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      - name: Set deployment metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DEPLOY_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "IS_STAGING=0" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_URL=https://$DOMAIN/staging" >> "$GITHUB_ENV"
            echo "IS_STAGING=1" >> "$GITHUB_ENV"
          fi

      # ─────────────────────────────────────────────
      - name: Set build id
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_ID=$(date +%s)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          rsync -a \
            --delete \
            --exclude ".git" \
            --exclude ".godot" \
            --exclude ".import" \
            --exclude "exports" \
            ./ "$WORKSPACE/"

      # ─────────────────────────────────────────────
      - name: Import project
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --import --quit

      # ─────────────────────────────────────────────
      - name: Export web build
        shell: bash
        env:
          HOME: /home/godot
        run: |
          set -euo pipefail

          BUILD_DIR="$RELEASES/$BUILD_ID"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --export-release Web \
            "$BUILD_DIR/index.html"

      # ─────────────────────────────────────────────
      - name: Remove Godot manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$BUILD_DIR/index.manifest.json"

      # ─────────────────────────────────────────────
      - name: Copy PWA assets
        shell: bash
        run: |
          set -euo pipefail

          cp "$WORKSPACE/.github/PWA/icon_144x144.png" "$BUILD_DIR/"
          cp "$WORKSPACE/.github/PWA/icon_180x180.png" "$BUILD_DIR/"
          cp "$WORKSPACE/.github/PWA/icon_512x512.png" "$BUILD_DIR/"

          mkdir -p "$BUILD_DIR/screenshots"
          cp "$WORKSPACE/.github/PWA/desktop.png" "$BUILD_DIR/screenshots/"
          cp "$WORKSPACE/.github/PWA/mobile.png" "$BUILD_DIR/screenshots/"

      # ─────────────────────────────────────────────
      - name: Generate web manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > "$BUILD_DIR/manifest.webmanifest" <<EOF
          {
            "name": "$GAME_NAME",
            "short_name": "$GAME_NAME",
            "start_url": "/index.html",
            "scope": "/",
            "display": "standalone",
            "background_color": "$THEME_COLOR",
            "theme_color": "$THEME_COLOR"
          }
          EOF

      # ─────────────────────────────────────────────
      - name: Generate robots.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_STAGING" == "1" ]]; then
            cat > "$BUILD_DIR/robots.txt" <<EOF
User-agent: *
Disallow: /
EOF
          else
            cat > "$BUILD_DIR/robots.txt" <<EOF
User-agent: *
Allow: /
Sitemap: $DEPLOY_URL/sitemap.xml
EOF
          fi

      # ─────────────────────────────────────────────
      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail

          for f in index.html index.js index.wasm index.pck manifest.webmanifest; do
            [[ -f "$BUILD_DIR/$f" ]] || { echo "Missing $f"; exit 1; }
          done

      # ─────────────────────────────────────────────
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGET="$PRODUCTION"
          else
            TARGET="$STAGING"
          fi

          ln -sfn "$BUILD_DIR" "${TARGET}.tmp"
          mv -Tf "${TARGET}.tmp" "$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      - name: Validate deploy
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(readlink -f "$TARGET")" == "$BUILD_DIR" ]]
