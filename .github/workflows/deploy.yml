name: Godot Web Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: godot-web-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GODOT: /usr/local/bin/godot
  WORKSPACE: /var/lib/godot/workspace-${{ github.ref_name }}
  RELEASES: /var/www/godot/releases
  PRODUCTION: /var/www/godot/production
  STAGING: /var/www/godot/staging

jobs:
  build:
    runs-on: [self-hosted, godot, proxmox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load config
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json; cfg=json.load(open('.github/config.json')); print('DOMAIN=' + cfg['domain']); print('THEME_COLOR=' + cfg['theme_color'])" >> "$GITHUB_ENV"
          echo "GAME_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Set deployment metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "DEPLOY_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "IS_STAGING=0" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_URL=https://$DOMAIN/staging" >> "$GITHUB_ENV"
            echo "IS_STAGING=1" >> "$GITHUB_ENV"
          fi

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".godot" \
            --exclude ".import" \
            --exclude "addons/godot-git-plugin" \
            ./ "$WORKSPACE/"

      - name: Import project
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --import --quit

      - name: Export web build
        shell: bash
        env:
          HOME: /home/godot
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail

          BUILD_ID="$(date +%s)-${GITHUB_SHA::7}"
          BUILD_DIR="$RELEASES/$BUILD_ID"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          mkdir -p "$RELEASES"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          "$GODOT" --headless \
            --path "$WORKSPACE" \
            --export-release Web \
            "$BUILD_DIR/index.html"

          sync

      - name: Write version (authoritative)
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_DIR/version.cfg" <<'PY'
from pathlib import Path
import datetime
import os
import sys

dst = Path(sys.argv[1])
src = Path(os.environ["WORKSPACE"]) / "version.cfg"

values = {
    "major": "0",
    "minor": "0",
    "patch": "0",
}

if src.exists():
    for line in src.read_text(encoding="utf-8").splitlines():
        if "=" not in line:
            continue
        key, value = line.split("=", 1)
        key = key.strip()
        value = value.strip()
        if key in values and value:
            values[key] = value

channel = "release" if os.environ["GITHUB_REF_NAME"] == "main" else "staging"

content = (
    "[version]\n"
    f"major={values['major']}\n"
    f"minor={values['minor']}\n"
    f"patch={values['patch']}\n\n"
    "[channel]\n"
    f"name={channel}\n\n"
    "[build]\n"
    f"commit={os.environ['GITHUB_SHA'][:7]}\n"
    f"id={os.environ['BUILD_ID']}\n"
    f"date={datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')}\n"
)

dst.write_text(content, encoding="utf-8")
PY

      - name: Copy PWA assets
        shell: bash
        run: |
          set -euo pipefail

          cp "$WORKSPACE/.github/PWA/icon_144x144.png" "$BUILD_DIR/"
          cp "$WORKSPACE/.github/PWA/icon_180x180.png" "$BUILD_DIR/"
          cp "$WORKSPACE/.github/PWA/icon_512x512.png" "$BUILD_DIR/"

          mkdir -p "$BUILD_DIR/screenshots"
          cp "$WORKSPACE/.github/PWA/desktop.png" "$BUILD_DIR/screenshots/"
          cp "$WORKSPACE/.github/PWA/mobile.png" "$BUILD_DIR/screenshots/"

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_DIR/manifest.webmanifest" <<'PY'
from pathlib import Path
import json
import os
import sys

dst = Path(sys.argv[1])

manifest = {
    "name": os.environ["GAME_NAME"],
    "short_name": os.environ["GAME_NAME"],
    "start_url": "/index.html",
    "scope": "/",
    "display": "standalone",
    "theme_color": os.environ["THEME_COLOR"],
    "background_color": os.environ["THEME_COLOR"],
    "icons": [
        {
            "src": "/icon_144x144.png",
            "sizes": "144x144",
            "type": "image/png",
            "purpose": "any",
        },
        {
            "src": "/icon_180x180.png",
            "sizes": "180x180",
            "type": "image/png",
            "purpose": "any",
        },
        {
            "src": "/icon_512x512.png",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "maskable any",
        },
    ],
    "screenshots": [
        {
            "src": "/screenshots/desktop.png",
            "sizes": "1280x720",
            "type": "image/png",
            "form_factor": "wide",
        },
        {
            "src": "/screenshots/mobile.png",
            "sizes": "1080x1920",
            "type": "image/png",
        },
    ],
}

dst.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
PY

      - name: Generate robots.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_STAGING" == "1" ]]; then
            printf 'User-agent: *\nDisallow: /\n' > "$BUILD_DIR/robots.txt"
          else
            printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$DEPLOY_URL" > "$BUILD_DIR/robots.txt"
          fi

      - name: Patch index.html
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$BUILD_DIR/index.html" <<'PY'
from pathlib import Path
import re
import sys

p = Path(sys.argv[1])
html = p.read_text(encoding="utf-8")

html = html.replace(
    '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">',
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
)

html = re.sub(
    r'<link rel="manifest" href="index\.manifest\.json">\s*',
    '',
    html,
)

if '<link rel="manifest"' not in html:
    html = html.replace(
        "</head>",
        '  <link rel="manifest" href="manifest.webmanifest">\n</head>',
        1,
    )

html = html.replace(
    "overflow: hidden;",
    "overflow: hidden; width: 100vw; height: 100vh;"
)

html = html.replace(
    '"ensureCrossOriginIsolationHeaders":true',
    '"ensureCrossOriginIsolationHeaders":false'
)

p.write_text(html, encoding="utf-8")
PY

      - name: Validate build (strict)
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=(
            index.html
            index.js
            index.wasm
            index.pck
            manifest.webmanifest
            version.cfg
            icon_144x144.png
            icon_180x180.png
            icon_512x512.png
            screenshots/desktop.png
            screenshots/mobile.png
          )

          for f in "${REQUIRED[@]}"; do
            [[ -s "$BUILD_DIR/$f" ]] || {
              echo "Missing: $f"
              exit 1
            }
          done

      - name: Deploy (atomic swap)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TARGET="$PRODUCTION"
          else
            TARGET="$STAGING"
          fi

          sync
          ln -sfn "$BUILD_DIR" "$TARGET.tmp"
          mv -Tf "$TARGET.tmp" "$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Validate deployed build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(readlink -f "$TARGET")" == "$BUILD_DIR" ]]

      - name: Cleanup releases
        shell: bash
        run: |
          set -euo pipefail

          KEEP=10

          PROD="$(readlink -f "$PRODUCTION" 2>/dev/null || true)"
          STAGE="$(readlink -f "$STAGING" 2>/dev/null || true)"

          count=0

          while IFS= read -r r; do
            [[ -z "$r" ]] && continue

            if [[ "$r" == "$PROD" || "$r" == "$STAGE" ]]; then
              continue
            fi

            ((count++))
            if (( count > KEEP )); then
              rm -rf -- "$r"
            fi
          done < <(
            find "$RELEASES" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
          )
